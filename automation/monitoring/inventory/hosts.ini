; =============================================================================
; hosts.ini — Inventaire Ansible pour deploy-exporters.yml
;             Cibles strictement alignees sur docs/00-architecture-reference.md
;             (domaine example.local, donnees anonymisees).
;
; USAGE :
;   ansible-playbook -i inventory/hosts.ini ../deploy-exporters.yml --check
; =============================================================================

[linux_nodes]
; Hyperviseurs Proxmox VE 8.2 (VLAN 20 SERVERS)
pve01 ansible_host=10.10.20.10 ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/id_ed25519
pve02 ansible_host=10.10.20.11 ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/id_ed25519
; Supervision (VLAN 60 MONITORING)
mon-prom-01  ansible_host=10.10.60.10
mon-graf-01  ansible_host=10.10.60.11
mon-alert-01 ansible_host=10.10.60.12
mon-zbx-01   ansible_host=10.10.60.20
; Serveurs Linux metier (VLAN 80 APPS)
app01  ansible_host=10.10.80.101
glpi01 ansible_host=10.10.80.110
; PBS (VLAN 50 BACKUP) + DMZ (VLAN 90)
pbs01   ansible_host=10.10.50.10
dmz-rp-01 ansible_host=10.10.90.10

[pve_nodes:children]
; Sous-groupe nœuds PVE : pve-exporter uniquement
pve01
pve02

[windows_nodes]
; Windows Server 2022 (VLAN 20 SERVERS) — WinRM + creds via env/secret file
DC01 ansible_host=10.10.20.101 ansible_user=EXAMPLE\\ansible-win
DC02 ansible_host=10.10.20.102 ansible_user=EXAMPLE\\ansible-win
FILE01 ansible_host=10.10.20.110 ansible_user=EXAMPLE\\ansible-win
WSUS01 ansible_host=10.10.20.111 ansible_user=EXAMPLE\\ansible-win

[prometheus_host]
; Heberge aussi blackbox_exporter (:9115) et snmp_exporter (:9116)
mon-prom-01

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
; Windows : WinRM via groupe `windows_nodes` (creds NULLES ici — voir .env)
; ansible_winrm_transport=ntlm  (mot de passe via ansible-vault / env)
