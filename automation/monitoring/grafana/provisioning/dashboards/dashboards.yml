# =============================================================================
# dashboards.yml — Provider de dashboards Grafana (as-code)
# Deploie dans : /etc/grafana/provisioning/dashboards/dashboards.yml
# Les JSON de dashboards (reseau, PVE, sauvegardes) vivent dans ce depot
# sous grafana/dashboards/*.json et sont versionnes avec l'infra.
# =============================================================================
apiVersion: 1

providers:
  - name: "example-infra"               # dossier de l'UI Grafana
    orgId: 1
    folder: "Infrastructure example.local"
    type: file
    disableDeletion: true               # lecture seule dans l'UI : as-code only
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/example   # sync par rsync/ansible
      foldersFromFilesStructure: false
