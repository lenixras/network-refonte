    hostname: app01.example.local
    node: pve02
    os: "Debian 12 / runtime métier"
    role: "Application métier"
    ip: 10.10.80.101
    vlan: 80
    cores: 4
    memory_mb: 8192
    disk_gb: 80
    storage: local-zfs
  - vmid: 210
    name: GLPI01
    hostname: glpi01.example.local
    node: pve02
    os: "Debian 12 / GLPI 10.0.x"
    role: "GLPI — ITSM / tickets"
    ip: 10.10.80.110
    vlan: 80
    cores: 4
    memory_mb: 8192
    disk_gb: 120
    storage: local-zfs
  - vmid: 301
