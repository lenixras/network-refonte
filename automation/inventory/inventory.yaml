# -----------------------------------------------------------------------------
# Paramètres réseau globaux pour le provisionning
# -----------------------------------------------------------------------------
network_defaults:
  dns_servers: ["10.10.20.101", "10.10.20.102"]   # DC01 / DC02
  dns_search: example.local
  cloudinit_template_vmid: 9000                   # convention locale (hors plan)
  storage_sys: local-zfs
  storage_nas: nas-nfs                            # VLAN 15, MTU 9000 (cf. plan §5)
