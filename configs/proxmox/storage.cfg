# ============================================================================
# FICHIER : storage.cfg  (EXTRAIT ILLUSTRATIF — miroir /etc/pve/storage.cfg)
# PERIPHERIQUE : cluster PROXMOX VE 8.2 (pve01/pve02)
# ROLE : declarations de stockage (ZFS local, NFS Synology, Proxmox Backup)
# SOURCE DE VERITE : docs/00-architecture-reference.md (section 5)
# ----------------------------------------------------------------------------
# FAITS : NAS 10.10.50.20 (nas01, VLAN 50, acces via VLAN 15 mtu 9000 pour NFS
#         de service) ; PBS01 = 10.10.50.10 (VLAN 50, PBS 3.1).
# VALEURS ANONYMISEES : example.local ; token PBS / fingerprint -> <REDACTED>.
# ============================================================================

# --- Stockage local : ZFS raid1 (HPE ProLiant, miroir local) ----------------
local-zfs: local
    pool local-zfs
    content images,rootdir
    shared no
    # raid1 local (2 SSD/NVMe) — datastore des VM "local" (voir plan VM section 5)

# --- NFS depuis le NAS Synology (montage de service) ------------------------
# Partage expose par nas01.example.local ; trafic via VLAN 15 (corosync/storage)
# ou VLAN 50 selon routage ; MOUNT avec options pour MTU 9000.
nfs: nas-nfs
    export 10.10.50.20:/volume1/pve-nas
    path /mnt/pve/nas-nfs
    options vers=4.2,mountproto=tcp,rsize=1048576,wsize=1048576,hard,intr
    content images,iso,vztmpl,backup
    max_images 40
    shared yes
    disable=false
    # note : le point de montage est utilise pour ISO/backup ; le dataset de
    # production des VM reste prioritairement local-zfs (performances).

# --- Proxmox Backup Server (PBS01, datastore "dist-pbs") --------------------
# Ingest via VLAN 50 (10.10.50.10:8007). Fingerprint = anonymise ; en prod,
# verifier l'empreinte TLS a l'ajout (pvesm add ... / UI Storage > PBS).
pbs: dist-pbs
    server 10.10.50.10
    datastore backup-pbs
    username backup@pbs
    password <REDACTED>
    fingerprint <REDACTED>
    content images,backup
    shared yes
    disable=false
    # namespace recommande par classe : tier0 / tier1 / tier2 (voir backup.md)

# ----------------------------------------------------------------------------
# STRATEGIE 3-2-1 (resume section 7 du plan) :
#   3 copies : prod (local-zfs) + PBS (dist-pbs) + NAS (Snapshot Replication)
#   2 supports : ZFS local + NFS/Synology
#   1 hors-site : PBS -> replication chiffree vers storage objet distant
#                  (NAS : backup-pbs ; cf. synology/snapshot-replication.md)
# ============================================================================
# FIN — storage.cfg (extrait). Les noeuds pve01/pve02 partagent pmxcfs : une
# seule definition ici s'applique au cluster entier.
# ============================================================================
