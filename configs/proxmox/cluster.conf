# ============================================================================
# FICHIER : cluster.conf  (EXTRAIT DE CONFIGURATION — données anonymisées — miroir /etc/pve/corosync.conf)
# PERIPHERIQUE : cluster PROXMOX VE 8.2 — 2 noeuds (pve01 + pve02)
# ROLE : corosync / haute disponibilite. ring0 sur VLAN 15 CLUSTER (MTU 9000).
# SOURCE DE VERITE : docs/00-architecture-reference.md (sections 4 & 5)
# ----------------------------------------------------------------------------
# FAITS : pve01 ring0=10.10.15.10 (nodeid 1) | pve02 ring0=10.10.15.11 (nodeid 2)
# VALEURS ANONYMISEES : example.local ; totem key / crypto -> <REDACTED>.
# ============================================================================

logging {
    fileline: off
    to_stderr: no
    to_logfile: yes
    logfile: /var/log/daemon.log
    syslog: yes
    debug: off
    timestamp: on
}

totem {
    version: 2
    secauth: on
    # cle de la porte (cluster) — ANONYMISEE ; ne jamais committer la vraie
    crypto_hash: sha256
    crypto_cipher: aes256
    cluster_name: pve-cluster-example
    # ring0 = VLAN 15 CLUSTER, MTU 9000, pas de routage management
    interface {
        ringnumber: 0
        link0address: 10.10.15.10
        link1address: 10.10.15.11
        mcastport: 5405
        ttl: 1
    }
    transport: knet
    # redondance : 2 liens (bond0 LACP) — voir pve01-network.yaml
}

nodelist {
    node {
        ring0_addr: 10.10.15.10
        nodeid: 1
        name: pve01
    }
    node {
        ring0_addr: 10.10.15.11
        nodeid: 2
        name: pve02
    }
}

quorum {
    provider: corosync_votequorum
    expected_votes: 2
    two_node: 1
}

# ----------------------------------------------------------------------------
# NOTE QDEVICE (important cluster 2 noeuds) :
#   Avec 2 seuls membres, on perd la tolerance de panne (pas de vote tiers).
#   Recommandation : deployer un corosync-qdevice (tier 0, ex. sur un 3e hote
#   ou en VM legere) + qdevice/net sur chaque noeud, pour eviter le split-brain
#   et garder les VM HA demarrables apres panne d'un noeud.
#   qdevice.model = net ; qdevice.host = <REDACTED> (anonymise)
# ----------------------------------------------------------------------------

qcdevice {
    autocoroassist: 1
    # config complete gere par 'pveum' / pmxcfs ; extrait seul
}

# ============================================================================
# FIN — cluster.conf (extrait). /etc/hosts : 10.10.20.10 pve01.example.local ;
# 10.10.20.11 pve02.example.local. Stockage partage : storage.cfg.
# ============================================================================
