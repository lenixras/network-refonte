;
; ============================================================================
; FICHIER : access-switch.cfg (EXTRAIT ILLUSTRATIF — sauvegarde type)
; PERIPHERIQUE : Aruba CX 6100 24G PoU 370W (switch d'acces #1, Zone A)
; HOSTNAME : acc-sw-a1.example.local (10.10.10.11 / MGMT)
; ROLE : acces postes (VLAN 30) + points de diffusion WiFi (AP en VLAN 10)
; SOURCE DE VERITE : docs/00-architecture-reference.md (sections 3 et 4)
; ----------------------------------------------------------------------------
; VALEURS ANONYMISEES : domaine example.local ; SNMP v3 / SSH -> <REDACTED>.
; Switch L2 : pas de routage inter-VLAN (assure par le core 10.10.10.1).
; ============================================================================
!
hostname acc-sw-a1
!
; ----------------------------------------------------------------------------
; VLANs locaux — seuls MGMT(10), USERS(30), WIFI(40), GUEST(70) sont utiles ici
; ----------------------------------------------------------------------------
vlan 10
  name MGMT
vlan 30
  name USERS
vlan 40
  name WIFI
vlan 70
  name GUEST
!
; ----------------------------------------------------------------------------
; SVI de gestion (in-band VLAN 10) + passerelle = core.
; ----------------------------------------------------------------------------
interface vlan 10
  no routing
  ip addr 10.10.10.11/24
ip default-gateway 10.10.10.1
!
; ----------------------------------------------------------------------------
; UPLINK TRUNK vers le core (port 1/1/28) — tous les VLANs tagges, natif MGMT.
; ----------------------------------------------------------------------------
interface 1/1/28
  description TRUNK-vers-core-sw-01
  no routing
  vlan trunk native 10
  vlan trunk allowed 10,15,20,30,40,50,60,70,80,90
  mtu 9216
!
; ----------------------------------------------------------------------------
; ACCESS POSTES : ports 1/1/1 -> 1/1/20 en VLAN 30 (data). Voix optionnelle.
; edge-port + storm control (postes non manages).
; ----------------------------------------------------------------------------
interface 1/1/1 to 1/1/20
  description ACCESS-POSTE
  no routing
  vlan access 30
!
; ----------------------------------------------------------------------------
; PORT POINT D'ACCES WiFi (ap-corpo-01) — motif correct, conforme au plan :
;   - section 4 : l'AP est manage en VLAN 10 (reservations DHCP 10.10.10.31),
;   - le trafic SANS FIL des clients sort TAGGE : 40 (CORP-SSID) + 70 (GUEST).
;   => NATIF/untagged = VLAN 10 (gestion AP), PAS VLAN 30.
;   (Si l'AP etait manage en data, on mettrait "vlan access 30" + tag 40.)
; PoE : le 6100 PoU 370W alimente l'AP (802.3af/at) sur ce port.
; ----------------------------------------------------------------------------
interface 1/1/24
  description AP-corpo-01 (PoE)
  no routing
  poe
  vlan trunk native 10
  vlan trunk allowed 10,40,70
!
; Port de secours / AP Zone B au besoin (meme motif)
interface 1/1/25
  description AP-corpo-02 (PoE)
  no routing
  poe
  vlan trunk native 10
  vlan trunk allowed 10,40,70
!
; ----------------------------------------------------------------------------
; Gestion / securite
; ----------------------------------------------------------------------------
ssh
vty 1
  transport ssh
snmp-server v3
  user snmpmon auth sha <REDACTED> priv aes <REDACTED>
ntp server 10.10.20.101
!
; ============================================================================
; FIN — access-switch.cfg (extrait). Les switches #2/#3 (acc-sw-b1 10.10.10.12,
; acc-sw-c1 10.10.10.13) reprennent la meme trame avec hostname/MGMT IP adaptes.
; ============================================================================
