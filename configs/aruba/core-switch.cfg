;
; ============================================================================
; FICHIER : core-switch.cfg (EXTRAIT DE CONFIGURATION — données anonymisées — sauvegarde type)
; PERIPHERIQUE : Aruba CX 6300 24SFP+ — stack VSF 2 membres
; HOSTNAME : core-sw-01.example.local (10.10.10.2 / MGMT)
; ROLE : coeur L3, routage inter-VLAN, relais DHCP, route par defaut -> FW
; SOURCE DE VERITE : docs/00-architecture-reference.md (sections 3 et 4)
; ----------------------------------------------------------------------------
; VALEURS ANONYMISEES :
;   - IP publiques        -> PUBLIC_IP_REDACTED / PUBLIC_GW_REDACTED
;   - domaine interne     -> example.local
;   - secrets / SNMP v3   -> <REDACTED> (never commit real credentials)
; Ce fichier n'est PAS une config complete ; extraits CLI representatifs.
; ============================================================================
!
hostname core-sw-01
!
; ----------------------------------------------------------------------------
; VSF stack (2 membres) — ports de pile dedies 1/1/29-30 et 1/2/29-30
; ----------------------------------------------------------------------------
vsf
  member 1
    interface 1/1/29
    interface 1/1/30
  member 2
    interface 1/2/29
    interface 1/2/30
  auto-merge on
!
; ----------------------------------------------------------------------------
; VLANs — convention : "vlan <ID>" puis "name <NOM>" (plan section 3)
; ----------------------------------------------------------------------------
vlan 10
  name MGMT
vlan 15
  name CLUSTER
vlan 20
  name SERVERS
vlan 30
  name USERS
vlan 40
  name WIFI
vlan 50
  name BACKUP
vlan 60
  name MONITORING
vlan 70
  name GUEST
vlan 80
  name APPS
vlan 90
  name DMZ
!
; ----------------------------------------------------------------------------
; SVI = routage inter-VLAN. Passerelles conformes au plan (section 3).
; MTU 9000 sur VLAN 15 (CLUSTER/corosync) et VLAN 50 (BACKUP).
; ip helper-address = relais DHCP vers DC01/DC02 pour les VLANs clients.
; ----------------------------------------------------------------------------
interface vlan 10
  ip addr 10.10.10.1/24
interface vlan 15
  ip addr 10.10.15.1/24
  mtu 9000
interface vlan 20
  ip addr 10.10.20.1/24
interface vlan 30
  ip addr 10.10.30.1/24
  ip helper-address 10.10.20.101
  ip helper-address 10.10.20.102
interface vlan 40
  ip addr 10.10.40.1/22
  ip helper-address 10.10.20.101
  ip helper-address 10.10.20.102
interface vlan 50
  ip addr 10.10.50.1/24
  mtu 9000
interface vlan 60
  ip addr 10.10.60.1/24
interface vlan 70
  ip addr 10.10.70.1/22
  ip helper-address 10.10.20.101
  ip helper-address 10.10.20.102
interface vlan 80
  ip addr 10.10.80.1/24
interface vlan 90
  ip addr 10.10.90.1/28
!
; IP de gestion de l'equipement (section 4 : 10.10.10.2), routee via VLAN 10 ;
; utilisee comme router-id / source SNMP+syslog.
interface loopback 1
  ip addr 10.10.10.2/32
!
; ----------------------------------------------------------------------------
; Route par defaut -> interface interne du WatchGuard (10.10.10.254, VLAN 10)
; ----------------------------------------------------------------------------
ip route 0.0.0.0/0 10.10.10.254
!
; ----------------------------------------------------------------------------
; Uplinks TRUNK vers switches d'acces (tous les VLANs tagges, natif = MGMT 10)
; ----------------------------------------------------------------------------
interface 1/1/1
  description TRUNK-vers-acc-sw-a1 (Zone A)
  no routing
  vlan trunk native 10
  vlan trunk allowed 10,15,20,30,40,50,60,70,80,90
interface 1/1/2
  description TRUNK-vers-acc-sw-b1 (Zone B)
  no routing
  vlan trunk native 10
  vlan trunk allowed 10,15,20,30,40,50,60,70,80,90
interface 1/1/3
  description TRUNK-vers-acc-sw-c1 (Zone C)
  no routing
  vlan trunk native 10
  vlan trunk allowed 10,15,20,30,40,50,60,70,80,90
!
; ----------------------------------------------------------------------------
; Interco L3 vers le pare-feu WatchGuard (fw.example.local) — membre VLAN 10.
; L'interface Trusted du Firebox porte 10.10.10.254 (section 4).
; ----------------------------------------------------------------------------
interface 1/1/24
  description L3-vers-FWWG (fw.example.local)
  vlan access 10
!
; ----------------------------------------------------------------------------
; securite / gestion : SSH vty actif, acces admin restreint au subnet MGMT.
; ----------------------------------------------------------------------------
ssh
acl admin-mgmt
  rule 1 permit tcp 10.10.10.0/24 any eq 22 comment ACCES-SSH-ADMIN
  rule 2 deny ip any any
vty 1
  transport ssh
  acl admin-mgmt in
!
; SNMP v3 uniquement (pas de v2c ; communautes = anonymisees)
snmp-server v3
  user snmpmon auth sha <REDACTED> priv aes <REDACTED>
!
ntp server 10.10.20.101
ntp server 10.10.20.102
!
; ============================================================================
; FIN — core-switch.cfg (extrait). Voir watchguard/ pour la politique FW.
; ============================================================================
